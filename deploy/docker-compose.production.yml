version: '3.8'

# ==============================================================================
# SUCHARU PRO ERP — PRODUCTION DOCKER COMPOSE DEPLOYMENT (INFRA-05 Step 07)
# ==============================================================================
# Canonical 4-tier production stack:
# Edge (Nginx TLS) -> Backend (Sucharu JVM) -> Primary Store (PostgreSQL RLS) & Cache (Redis)

services:
  postgres:
    image: postgres:16-alpine
    container_name: sucharu_postgres_prod
    restart: always
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-sucharu_pro_db}
      POSTGRES_USER: ${DATABASE_USER:-sucharu_app}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required in production}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-sucharu_app} -d ${DATABASE_NAME:-sucharu_pro_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 512M
    networks:
      - sucharu_prod_network
    # IMPORTANT: PostgreSQL port 5432 is NOT exposed to the host/internet for security.

  redis:
    image: redis:7-alpine
    container_name: sucharu_redis_prod
    restart: always
    command: >
      sh -c 'if [ -n "$$REDIS_PASSWORD" ]; then
        redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru;
      else
        redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru;
      fi'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    networks:
      - sucharu_prod_network
    # IMPORTANT: Redis port 6379 is NOT exposed to the host/internet for security.

  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    image: sucharu-backend:1.0.0
    container_name: sucharu_backend_prod
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: production
      ENVIRONMENT: production
      APP_NAME: ${APP_NAME:-sucharu-backend}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      BUILD_VERSION: ${BUILD_VERSION:-1.0.0-PROD}
      SERVER_HOST: 0.0.0.0
      PORT: 8080
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME:-sucharu_pro_db}
      DATABASE_USER: ${DATABASE_USER:-sucharu_app}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required in production}
      DATABASE_URL: jdbc:postgresql://postgres:5432/${DATABASE_NAME:-sucharu_pro_db}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-20}
      DATABASE_MIN_IDLE: ${DATABASE_MIN_IDLE:-5}
      DATABASE_CONN_TIMEOUT_MS: ${DATABASE_CONN_TIMEOUT_MS:-30000}
      REDIS_ENABLED: ${REDIS_ENABLED:-false}
      REDIS_URL: ${REDIS_URL:-}
      JWT_SIGNING_SECRET: ${JWT_SIGNING_SECRET:?JWT_SIGNING_SECRET must be at least 32 characters in production}
      JWT_ISSUER: ${JWT_ISSUER:-sucharu-backend-server}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-sucharu-api-clients}
      WORKER_POOL_SIZE: ${WORKER_POOL_SIZE:-10}
      WORKER_POLL_INTERVAL_MS: ${WORKER_POLL_INTERVAL_MS:-2000}
      WORKER_LEASE_DURATION_MS: ${WORKER_LEASE_DURATION_MS:-30000}
      FLYWAY_ENABLED: ${FLYWAY_ENABLED:-true}
      MIGRATION_MODE: ${MIGRATION_MODE:-AUTO_APPLY}
      OBSERVABILITY_ENABLED: ${OBSERVABILITY_ENABLED:-true}
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      METRICS_ENDPOINT_ENABLED: ${METRICS_ENDPOINT_ENABLED:-true}
      GRACEFUL_SHUTDOWN_TIMEOUT_MS: ${GRACEFUL_SHUTDOWN_TIMEOUT_MS:-5000}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 512M
    networks:
      - sucharu_prod_network
    # IMPORTANT: Backend port 8080 is only accessible internally by Nginx within sucharu_prod_network.

  nginx:
    image: nginx:1.25-alpine
    container_name: sucharu_nginx_prod
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d/sucharu.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - certbot_data:/var/www/certbot:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M
    networks:
      - sucharu_prod_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  certbot_data:
    driver: local

networks:
  sucharu_prod_network:
    driver: bridge
