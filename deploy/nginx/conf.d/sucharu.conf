# ==============================================================================
# SUCHARU PRO ERP — NGINX EDGE & REVERSE PROXY CONFIGURATION (INFRA-05 Step 07)
# ==============================================================================

upstream sucharu_backend {
    server backend:8080 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# --- HTTP (Port 80) Edge: ACME Challenge & SSL Redirection ---
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Let's Encrypt / ACME challenge verification
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Health check bypass for load balancers on port 80
    location = /health {
        proxy_pass http://sucharu_backend/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Redirect all other HTTP traffic to HTTPS in production
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS (Port 443) Production Edge ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    # TLS Certificates (Mount your certificates to /etc/nginx/certs in docker-compose)
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # TLS Modern Security Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none';" always;

    # Request size limits (Printing artwork / quotations up to 10MB)
    client_max_body_size 10M;
    client_body_buffer_size 128k;

    # Timeouts
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Correlation ID handling: Preserve inbound X-Correlation-ID or pass generated
    set $correlation_id $http_x_correlation_id;
    if ($correlation_id = "") {
        set $correlation_id $request_id;
    }

    # Proxy Headers
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Correlation-ID $correlation_id;

    # Add correlation ID to outgoing response headers
    add_header X-Correlation-ID $correlation_id always;

    # Health & Readiness Probes (Public for orchestrator / uptime monitoring)
    location /health {
        proxy_pass http://sucharu_backend;
        access_log off;
    }

    location /ready {
        proxy_pass http://sucharu_backend;
        access_log off;
    }

    # Prometheus Metrics (Can be restricted to internal IP ranges in production)
    location /metrics {
        proxy_pass http://sucharu_backend;
    }

    # REST API & Webhooks
    location /api/ {
        proxy_pass http://sucharu_backend;
        proxy_buffering on;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
    }

    # Root application dispatcher
    location / {
        proxy_pass http://sucharu_backend;
    }
}
